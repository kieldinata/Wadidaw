name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - '**'

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false # Kita matikan LFS karena kita akan bersihkan binari secara lokal

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Daftarkan remote Hugging Face
          git remote add space https://kieldinata:$HF_TOKEN@huggingface.co/spaces/kieldinata/Wadidaw
          
          # 2. Buat branch lokal sementara
          git checkout -b hf-sync-branch
          
          # 3. HAPUS file biner dari Git History pelacak Hugging Face agar tidak di-reject
          #    (Tenang, file fisik gambarmu aman di repo GitHub, ini hanya menghapus dari track Git sementara)
          git rm --cached src/main/webapp/Resources/wadidaw-logo-white.png || true
          git rm --cached src/main/webapp/Resources/wadidaw-logo.png || true
          
          # 4. Commit perubahan "pembersihan" lokal ini
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "chore: clear binaries for hf compliance" || true
          
          # 5. Push ke Hugging Face Space
          git push space hf-sync-branch:main --force
